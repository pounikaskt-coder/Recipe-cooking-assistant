<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rasoi — Cooking Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">&#127859;</span>
        <div class="brand-text">
          <h1>Rasoi</h1>
          <p>your recipe &amp; cooking companion</p>
        </div>
      </div>
      <div class="header-note">01 &middot; ask &nbsp;&mdash;&nbsp; 02 &middot; cook &nbsp;&mdash;&nbsp; 03 &middot; eat</div>
    </header>

    <main class="chat-shell">
      <div id="chat-window" class="chat-window">
        <div class="msg bot">
          <div class="msg-bubble">
            Vanakkam! I'm Rasoi 🍲 — tell me an ingredient you have, a dish
            you're craving, or paste a recipe question, and I'll help you
            cook it.
          </div>
        </div>
      </div>

      <form id="chat-form" class="chat-input-row">
        <input
          id="chat-input"
          type="text"
          placeholder="e.g. what can I cook with rice and tomato?"
          autocomplete="off"
        />
        <button type="submit" id="send-btn">Send</button>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
